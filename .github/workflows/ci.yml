name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend tests
        run: python3 -m unittest discover -s backend/tests -v
      - name: Reward accounting tests
        run: python3 -m unittest discover -s rewards -p 'test_*.py' -v
      - name: Network adapter tests
        run: python3 -m unittest discover -s tests -v
      - name: Frontend syntax and smoke test
        run: |
          node --check dist/app.js
          node tests/frontend-smoke.mjs dist
      - name: Installer syntax
        run: bash -n backend/install.sh
