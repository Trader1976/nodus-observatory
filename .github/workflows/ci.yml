name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend tests
        run: python3 -m unittest discover -s backend/tests -v
      - name: Reward accounting tests
        run: python3 -m unittest discover -s rewards -p 'test_*.py' -v
      - name: Network adapter tests
        run: python3 -m unittest discover -s tests -v
      - name: Network statistics tests and distributable assets
        run: |
          python3 -m pip install maxminddb==3.2.0
          python3 network_statistics/sync_frontend.py --check
          python3 -m unittest discover -s network_statistics/tests -v
          node --check dist/statistics/statistics.js
          node network_statistics/tests/frontend.mjs
      - name: Frontend syntax and smoke test
        run: |
          node --check dist/i18n.js
          node --check dist/app-translations.js
          node --check dist/app.js
          node --check dist/observatory-settings.js
          node --check dist/observatory-settings-i18n.js
          node --check dist/contract-studio-core.js
          node --check dist/contract-studio-workflow-core.js
          node --check dist/contract-studio-i18n.js
          node --check dist/contract-studio.js
          node --check dist/contract-studio-builder.js
          node --check dist/contract-studio-builder-i18n.js
          node --check dist/document-notary-core.js
          node --check dist/document-notary-i18n.js
          node --check dist/document-notary.js
          node --check dist/trade-core.js
          node --check dist/trade-i18n.js
          node --check dist/trade.js
          node tests/trade/core.mjs
          node tests/trade/integration.mjs
          node tests/frontend-smoke.mjs dist
          node tests/frontend-i18n.mjs dist
          node tests/frontend-roles.mjs dist
          node tests/observatory-settings.mjs dist
          node tests/contract-studio-core.mjs
          node tests/contract-studio-integration.mjs
          node tests/contract-studio-workflow-core.mjs
          node tests/contract-studio-builder-integration.mjs
          node tests/document-notary-core.mjs
          node tests/document-notary-integration.mjs
      - name: Test DeFi foundation
        run: |
          python3 test_defi/sync_frontend.py --check
          node --check dist/test-defi/core.js
          node --check dist/test-defi/defi.js
          node test_defi/tests/core.mjs
          node test_defi/tests/frontend.mjs
      - name: Installer syntax
        run: |
          bash -n backend/install.sh
          bash -n network_statistics/enable_geoip.sh

  trade-contracts:
    # Match the locally tested GCC 13 toolchain. The pinned engine's bundled
    # GMP configure probes predate the C23 default of newer compiler images.
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install contract test dependencies
        run: npm ci --prefix tools/trade
      - name: Fetch the pinned Nodus compiler
        run: |
          curl -fL --retry 3 https://nodusnetwork.io/downloads/nodus-solc-0.8.30-nodus.addr256-linux-x86_64.tar.gz -o "$RUNNER_TEMP/nodus-solc.tar.gz"
          python3 - "$RUNNER_TEMP/nodus-solc.tar.gz" <<'PY'
          import hashlib, pathlib, sys
          assert hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest() == "a09d6486c944a795009f08dbc8210ce2eee2785248f9f5f7edc2aaa9c6934649"
          PY
          tar -xzf "$RUNNER_TEMP/nodus-solc.tar.gz" -C "$RUNNER_TEMP"
          echo "NODUS_SOLC=$RUNNER_TEMP/nodus-solc-0.8.30-nodus.addr256-linux-x86_64/solc-nodus" >> "$GITHUB_ENV"
      - name: Verify both compiler outputs and execute BNB bytecode
        run: |
          node tools/trade/build.mjs --check
          node tests/trade/contracts.mjs
      - name: Fetch the pinned Nodus execution engine
        run: |
          git init "$RUNNER_TEMP/nodus-engine"
          git -C "$RUNNER_TEMP/nodus-engine" remote add origin https://github.com/nocdem/dna.git
          git -C "$RUNNER_TEMP/nodus-engine" sparse-checkout set shared/evm shared/crypto/sign shared/crypto/hash shared/crypto/utils
          git -C "$RUNNER_TEMP/nodus-engine" fetch --depth 1 origin 2e881cc6e6d7a5050cc10400afc2b883f8fb712a
          git -C "$RUNNER_TEMP/nodus-engine" checkout FETCH_HEAD
          sudo apt-get update -qq
          sudo apt-get install -y build-essential gcc-13 g++-13 libssl-dev m4 xxd
          echo "NODUS_EVM_ROOT=$RUNNER_TEMP/nodus-engine" >> "$GITHUB_ENV"
      - name: Execute Nodus bytecode with full 32-byte addresses
        run: node tools/trade/test-nodus.mjs
      - name: Build and execute offline DeFi reference with a mock token
        run: |
          node test_defi/tools/build-contracts.mjs --check
          node test_defi/tools/test-contracts.mjs
      - name: Verify deployable sandbox wallet kit
        run: |
          node test_defi/tools/build-wallet-kit.mjs --check
          node test_defi/tests/wallet-kit.mjs
          node test_defi/tools/test-wallet-kit.mjs
